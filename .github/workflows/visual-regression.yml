name: visual-regression

on:
  pull_request:
    paths-ignore:
      - "README.md"
      - "README-zh.md"
      - "CHANGELOG.md"
      - "AGENTS.md"
      - "docs/**"
  push:
    branches: ["master"]

jobs:
  minimum-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.14.0

      - name: Compile public surfaces with the minimum compiler
        run: |
          typst compile --root . examples/slides-sky.typ /tmp/slides-sky.pdf
          typst compile --root . examples/slides-sunset.typ /tmp/slides-sunset.pdf
          typst compile --root . examples/note.typ /tmp/note.pdf
          typst compile --root . examples/dual-source.typ /tmp/dual-source.pdf
          typst compile --root . --input mode=note examples/dual-source.typ /tmp/dual-source-note.pdf
          typst compile --root . examples/layout-demo.typ /tmp/layout-demo.pdf
          typst compile --root . tests/fixtures/extras-entry.typ /tmp/extras-entry.pdf

  package-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.14.0

      - name: Build the Universe package directory
        run: |
          mkdir -p /tmp/xwysyy-package-path/preview/xwysyy
          scripts/build-universe-package /tmp/xwysyy-package-path/preview/xwysyy/0.4.0 --ref HEAD
          test -f /tmp/xwysyy-package-path/preview/xwysyy/0.4.0/xwysyy.typ
          test -f /tmp/xwysyy-package-path/preview/xwysyy/0.4.0/xwysyy-extras.typ
          test -f /tmp/xwysyy-package-path/preview/xwysyy/0.4.0/docs/LAYOUT.md
          test -x /tmp/xwysyy-package-path/preview/xwysyy/0.4.0/scripts/xwysyy-check
          test ! -e /tmp/xwysyy-package-path/preview/xwysyy/0.4.0/examples
          test ! -e /tmp/xwysyy-package-path/preview/xwysyy/0.4.0/tests

      - name: Compile through the package resolver
        run: |
          typst compile --root . --package-path /tmp/xwysyy-package-path --deps /tmp/xwysyy-core-deps.json template/main.typ /tmp/xwysyy-template.pdf
          python3 -c 'import json; paths = json.load(open("/tmp/xwysyy-core-deps.json"))["inputs"]; forbidden = [p for p in paths if "xwysyy-extras.typ" in p or "/src/extras.typ" in p or "/preview/cetz/" in p or "/preview/fletcher/" in p or "/preview/theorion/" in p]; assert not forbidden, forbidden'
          typst compile --root . --package-path /tmp/xwysyy-package-path tests/fixtures/package-entry.typ /tmp/xwysyy-package-entry.pdf

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.14.2

      - name: Install deterministic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-liberation fonts-noto-cjk fonts-noto-cjk-extra
          curl -fsSL -o /tmp/libertinus.zip https://github.com/alerque/libertinus/releases/download/v7.051/Libertinus-7.051.zip
          sudo unzip -jo /tmp/libertinus.zip 'Libertinus-7.051/static/OTF/LibertinusSans-*.otf' -d /usr/share/fonts/opentype/libertinus

      - name: Compile examples
        run: |
          typst compile --root . --input visual-ci=true examples/slides-sky.typ
          typst compile --root . --input visual-ci=true examples/slides-sunset.typ
          typst compile --root . --input visual-ci=true examples/note.typ
          typst compile --root . --input visual-ci=true examples/theme-preview.typ
          typst compile --root . --input visual-ci=true examples/dual-source.typ
          typst compile --root . --input visual-ci=true --input mode=note examples/dual-source.typ dual-source-note.pdf
          typst compile --root . --input visual-ci=true --input handout=true examples/slides-sky.typ slides-sky-handout.pdf
          typst compile --root . --input visual-ci=true examples/layout-demo.typ

      - name: Python regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Check theme contrast
        run: scripts/check-theme-contrast

      - name: Compile API fixtures
        run: |
          typst compile --root . tests/fixtures/custom-theme-direct.typ /tmp/custom-theme-direct.pdf
          typst compile --root . tests/fixtures/custom-theme-registered.typ /tmp/custom-theme-registered.pdf
          typst compile --root . tests/fixtures/outline-en.typ /tmp/outline-en.pdf
          typst compile --root . tests/fixtures/outline-zh.typ /tmp/outline-zh.pdf
          typst compile --root . tests/fixtures/outline-agenda.typ /tmp/outline-agenda.pdf
          typst compile --root . tests/fixtures/font-override.typ /tmp/font-override.pdf
          typst compile --root . tests/fixtures/layout-dual.typ /tmp/layout-dual-slides.pdf
          typst compile --root . --input mode=note tests/fixtures/layout-dual.typ /tmp/layout-dual-note.pdf
          typst compile --root . --input visual-ci=true tests/fixtures/layout-fit.typ /tmp/layout-fit.pdf
          typst compile --root . --input visual-ci=true tests/fixtures/layout-handout.typ /tmp/layout-handout.pdf
          typst compile --root . --input visual-ci=true --input handout=true tests/fixtures/layout-handout.typ /tmp/layout-handout-collapsed.pdf
          typst compile --root . --input visual-ci=true tests/fixtures/layout-pixel.typ /tmp/layout-pixel.pdf
          typst compile --root . tests/fixtures/extras-entry.typ /tmp/extras-entry.pdf

      - name: Check missing theme field error
        run: |
          if typst compile --root . tests/fixtures/custom-theme-missing-field.typ /tmp/custom-theme-missing.pdf 2> /tmp/custom-theme-missing.err; then
            cat /tmp/custom-theme-missing.err
            exit 1
          fi
          grep 'page-fill' /tmp/custom-theme-missing.err

      - name: Render visual set
        run: scripts/render-visuals /tmp/xwysyy-visual-current

      - name: Compare visual baseline
        run: scripts/compare-png tests/visual-baseline /tmp/xwysyy-visual-current --diff-dir /tmp/xwysyy-visual-diff

      - name: Upload current renders
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-current
          path: /tmp/xwysyy-visual-current
          if-no-files-found: ignore

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: /tmp/xwysyy-visual-diff
          if-no-files-found: ignore
