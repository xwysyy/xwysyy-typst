[package]
name = "xwysyy"
version = "0.4.0"
entrypoint = "xwysyy.typ"
authors = ["xwysyy"]
license = "MIT"
description = "Create academic slides and notes with touying."
repository = "https://github.com/xwysyy/xwysyy-typst"
keywords = ["slides", "presentation", "academic", "touying", "theme"]
categories = ["presentation", "components"]
disciplines = ["computer-science"]
compiler = "0.14.2"
# docs/LAYOUT.md and the layout QA toolchain (xwysyy-check, slide-check.py,
# and the compare-png decoder it reuses) ship with the package, so template
# users get the full feedback loop; CI/maintainer scripts stay repo-only.
exclude = ["examples/", "assets/", "docs/CUSTOMIZATION.md", "docs/DUAL-OUTPUT-DESIGN.md", "docs/ROADMAP.md", "docs/THEME-GENERATOR.md", "docs/USAGE.md", "tests/", "scripts/adopt-baseline", "scripts/check-theme-contrast", "scripts/gen-previews", "scripts/render-visuals", ".github/", "AGENTS.md", "CHANGELOG.md", "README-zh.md"]

[template]
path = "template"
entrypoint = "main.typ"
thumbnail = "thumbnail.png"
